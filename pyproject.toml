[build-system]
requires = ["setuptools>=46.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-template"
version = "0.1.0"
description = "Replace with a one-line description."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "psycopg[binary]>=3.3.5",
    "redis>=5.2",
    "structlog>=24",
    "python-dotenv>=1",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest>=8.3",
    "pytest-cov>=6",
    "ruff>=0.14",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*", "should_*"]
addopts = "-q --cov=src --cov-report=term-missing"

[tool.mypy]
ignore_missing_imports = true
strict = true

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    "docker",
    "deploy",
    "requirements",
    "media",
    ".env",
    "env",
    "node_modules",
    "samples",
    "logs",
    "data",
    "models",
    "notebooks",
    "__pycache__",
    "build",
    "dist",
    "scripts",
    "*migrations*",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "C90",    # mccabe complexity
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function calls in defaults — FastAPI Depends() pattern
    "SIM108", # ternary operator — not always clearer
    "SIM117", # nested with statements — more readable when mocking
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["src"]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"
